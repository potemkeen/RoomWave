[package]
name = "roomwave-host"
version = "0.1.5"
description = "Multichannel audio streaming over a local network"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
mdns-sd = "0.21.1"
log = "0.4"
env_logger = "0.11"
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.24"
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }
windows-core = "0.62"
