[package]
name = "roomwave-host"
version = "0.1.0"
description = "RoomWave LAN receiver discovery"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
mdns-sd = "0.21.1"
log = "0.4"
env_logger = "0.11"
serde_json = "1"
wasapi = "0.24"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com"] }
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }
